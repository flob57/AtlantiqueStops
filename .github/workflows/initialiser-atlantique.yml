name: Initialiser AtlantiqueStops depuis BreizhStops-v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clone-source:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer AtlantiqueStops
        uses: actions/checkout@v4

      - name: Récupérer BreizhStops-v2
        uses: actions/checkout@v4
        with:
          repository: flob57/BreizhStops-v2
          ref: main
          path: _breizhstops

      - name: Copier le projet
        run: |
          rsync -a --exclude='.git' _breizhstops/ ./
          rm -f .github/workflows/initialiser-atlantique.yml
          rm -rf _breizhstops

      - name: Enregistrer la copie
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Initialiser AtlantiqueStops depuis BreizhStops-v2"
          git push
